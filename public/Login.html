<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Chat</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101116;color:#f1f2f6;font:14px Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);border:1px solid rgba(255,255,255,.1);background:#171920;border-radius:16px;padding:27px;box-shadow:0 20px 60px #0005}.brand{display:flex;gap:10px;align-items:center;margin-bottom:24px}.mark{width:28px;height:28px;border-radius:10px;background:conic-gradient(from 210deg,#8ab4f8,#be9cff,#ffae79,#8ab4f8)}.brand strong{font-size:14px}.brand small{display:block;color:#77808c;font-size:10px;margin-top:2px}.card h1{font-size:23px;letter-spacing:-.7px;margin:0 0 6px}.intro{font-size:11px;line-height:1.6;color:#a0a6b2;margin:0 0 20px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:10px;color:#a0a6b2;font-weight:700}.field input{border:1px solid rgba(255,255,255,.1);background:#12141a;color:#f1f2f6;border-radius:8px;padding:11px;font:inherit;font-size:12px;outline:0}.field input:focus{border-color:#91b8ff}.button{width:100%;border:0;border-radius:8px;background:#91b8ff;color:#10131a;font-weight:800;padding:11px;cursor:pointer;margin-top:4px}.button:disabled{opacity:.55}.message{min-height:18px;font-size:10px;line-height:1.5;margin-top:11px;color:#a0a6b2}.message.error{color:#ff8989}.message.ok{color:#7bdbad}.switch{border:0;background:transparent;color:#91b8ff;padding:0;cursor:pointer;font:inherit;font-size:11px}.footer{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;margin-top:18px;color:#77808c;font-size:10px;line-height:1.7}.back{color:#a0a6b2;font-size:10px;display:inline-block;margin-top:16px}.hidden{display:none!important}</style></head>
<body><main class="card"><a class="brand" href="/"><span class="mark"></span><span><strong>Chat / harness</strong><small>local model workspace</small></span></a><h1 id="heading">Sign in</h1><p class="intro" id="intro">Sign in to manage local accounts. Chat and model setup remain available without an account.</p>
<form id="loginForm"><div class="field"><label for="identity">Username or email</label><input id="identity" name="identity" autocomplete="username" required></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Sign in</button></form>
<form id="signupForm" class="hidden"><div class="field"><label for="newUsername">Username</label><input id="newUsername" name="username" autocomplete="username" minlength="2" maxlength="32" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="newPassword">Password · at least 8 characters</label><input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required></div><button class="button" type="submit">Create administrator account</button></form>
<div class="message" id="message" role="status" aria-live="polite"></div><p id="switchArea" class="intro hidden" style="margin:15px 0 0">First visit? <button class="switch" id="showSignup" type="button">Create the administrator account</button></p><div class="footer" id="footerNote">An account protects access to user administration. Passwords are stored as salted scrypt hashes.</div><a class="back" href="/">← Back to chat</a></main>
<script>
const $=id=>document.getElementById(id);async function api(url,options={}){const response=await fetch(url,{...options,headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed');return data}function feedback(text,error=false){$('message').textContent=text;$('message').className=`message${error?' error':' ok'}`}function showSignup(){ $('loginForm').classList.add('hidden');$('signupForm').classList.remove('hidden');$('switchArea').classList.add('hidden');$('heading').textContent='Create admin account';$('intro').textContent='The first account becomes the local administrator. Use it to manage additional accounts.';$('footerNote').textContent='Use a unique password with at least 8 characters.'}
 $('showSignup').addEventListener('click',showSignup);$('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{const result=await api('/api/login',{method:'POST',body:JSON.stringify({identity:$('identity').value,password:$('loginPassword').value})});location.href=result.user.role==='admin'?'/admin':'/'}catch(error){feedback(error.message,true)}finally{button.disabled=false}});$('signupForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{await api('/api/signup',{method:'POST',body:JSON.stringify({username:$('newUsername').value,email:$('email').value,password:$('newPassword').value})});location.href='/admin'}catch(error){feedback(error.message,true);button.disabled=false}});api('/api/auth/me').then(result=>{if(result.user){location.href=result.user.role==='admin'?'/admin':'/';return}if(result.registrationOpen){$('switchArea').classList.remove('hidden');$('footerNote').textContent='The first account becomes the local administrator.'}else{$('footerNote').textContent='New accounts can be created by an administrator from the admin page.'}}).catch(error=>feedback(error.message,true));
</script></body></html>
