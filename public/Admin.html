<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .django-bg { background-color: #f8f8f8; }
        .django-sidebar { background-color: #264b5d; }
        .django-header { background-color: #417690; }
        .django-btn { background-color: #417690; }
        .django-btn:hover { background-color: #205067; }
    </style>
</head>
<body class="flex h-screen django-bg text-gray-800 font-sans">

    <!-- Sidebar -->
    <aside class="w-64 django-sidebar text-white flex flex-col shadow-lg">
        <div class="p-6 text-xl font-bold border-b border-gray-600 tracking-wide">🛡️ ADMIN PANEL</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" onclick="switchView('users')" id="nav-users" class="nav-item block px-4 py-2 rounded bg-gray-700 font-semibold transition">👥 Users</a>
            <a href="#" onclick="switchView('reports')" id="nav-reports" class="nav-item block px-4 py-2 rounded hover:bg-gray-700 transition">📊 Reports</a>
        </nav>
        <div class="p-4 border-t border-gray-600">
            <button type="button" onclick="logout()" class="w-full text-left px-4 py-2 rounded hover:bg-red-600 transition text-sm">🚪 Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="django-header text-white px-8 py-4 flex justify-between items-center shadow">
            <h1 id="pageTitle" class="text-lg font-semibold">User Management</h1>
            <div class="text-sm">Welcome, <span id="currentUser" class="font-bold">Admin</span></div>
        </header>

        <!-- USERS VIEW -->
        <div id="usersView" class="view-section flex-1 overflow-auto p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-700">Users</h2>
                <button type="button" onclick="openModal()" class="django-btn text-white px-4 py-2 rounded shadow transition flex items-center gap-2">
                    <span>+</span> Add User
                </button>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- REPORTS VIEW -->
        <div id="reportsView" class="view-section flex-1 overflow-auto p-8 hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-700">System Reports</h2>
                <button type="button" onclick="downloadCSV()" class="django-btn text-white px-4 py-2 rounded shadow transition flex items-center gap-2">⬇️ Export to CSV</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
                    <div class="text-sm font-medium text-gray-500 uppercase tracking-wide">Total Registered Users</div>
                    <div class="text-4xl font-bold text-gray-900 mt-3" id="reportTotalUsers">0</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
                    <div class="text-sm font-medium text-gray-500 uppercase tracking-wide">Database Status</div>
                    <div class="text-4xl font-bold text-green-600 mt-3 flex items-center gap-2">
                        <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> Active
                    </div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
                    <div class="text-sm font-medium text-gray-500 uppercase tracking-wide">Last Data Refresh</div>
                    <div class="text-xl font-bold text-gray-900 mt-3" id="reportLastRefresh">Never</div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
                    <h3 class="text-lg font-semibold text-gray-800">Complete User Directory</h3>
                </div>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">Loading report data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h3 id="modalTitle" class="text-xl font-bold mb-4 text-gray-800">Add New User</h3>
            <form id="userForm" class="space-y-4">
                <input type="hidden" id="userId">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password <span id="passwordHint" class="text-gray-400 text-xs">(Required for new users)</span></label>
                    <input type="password" id="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-700 bg-gray-200 rounded hover:bg-gray-300">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-white django-btn rounded">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allUsers = [];

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewName + 'View').classList.remove('hidden');
            
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-gray-700', 'font-semibold');
                el.classList.add('hover:bg-gray-700');
            });
            const activeNav = document.getElementById('nav-' + viewName);
            activeNav.classList.add('bg-gray-700', 'font-semibold');
            activeNav.classList.remove('hover:bg-gray-700');

            document.getElementById('pageTitle').innerText = viewName === 'users' ? 'User Management' : 'System Reports';
        }

        async function loadUsers() {
            try {
                // ✅ FIX: Added 'Accept': 'application/json' to prevent HTML redirect crashes
                const res = await fetch('/api/users', { 
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' }
                });
                
                if (res.status === 401) return window.location.href = '/auth';
                
                allUsers = await res.json();
                
                // 1. Update Users View Table
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';
                if (allUsers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No users found.</td></tr>';
                } else {
                    allUsers.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50 transition';
                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.id}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.username}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.email}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <button type="button" onclick="editUser(${user.id}, ${JSON.stringify(user.username)}, ${JSON.stringify(user.email)})" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>
                                <button type="button" onclick="deleteUser(${user.id})" class="text-red-600 hover:text-red-900">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                // 2. Update Reports View
                document.getElementById('reportTotalUsers').innerText = allUsers.length;
                document.getElementById('reportLastRefresh').innerText = new Date().toLocaleTimeString();
                
                const reportTbody = document.getElementById('reportTableBody');
                reportTbody.innerHTML = '';
                if (allUsers.length === 0) {
                    reportTbody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No data available for report.</td></tr>';
                } else {
                    allUsers.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-gray-50 transition';
                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.id}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.username}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.email}</td>
                        `;
                        reportTbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error('Failed to load users:', err);
                alert('Failed to load users. Check browser console (F12) for details.');
            }
        }

        function downloadCSV() {
            if (allUsers.length === 0) {
                alert('No data to export.');
                return;
            }
            const escapeCSV = (field) => `"${String(field).replace(/"/g, '""')}"`;
            const headers = ['ID', 'Username', 'Email'];
            const rows = allUsers.map(u => [u.id, escapeCSV(u.username), escapeCSV(u.email)]);
            const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', `user_report_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function openModal(isEdit = false) {
            const modal = document.getElementById('userModal');
            const passwordInput = document.getElementById('password');
            const passwordHint = document.getElementById('passwordHint');
            
            modal.classList.remove('hidden');
            document.getElementById('modalTitle').innerText = isEdit ? 'Edit User' : 'Add New User';
            
            if (!isEdit) {
                document.getElementById('userForm').reset();
                document.getElementById('userId').value = '';
                passwordInput.required = true;
                passwordHint.innerText = "(Required for new users)";
            } else {
                passwordInput.required = false;
                passwordHint.innerText = "(Leave blank to keep unchanged)";
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.add('hidden');
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
        }

        function editUser(id, username, email) {
            document.getElementById('userId').value = id;
            document.getElementById('username').value = username;
            document.getElementById('email').value = email;
            document.getElementById('password').value = '';
            openModal(true);
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('userId').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!id && !password) {
                alert('Password is required when adding a new user.');
                return;
            }

            const url = id ? `/api/users/${id}` : '/api/users';
            const method = id ? 'PUT' : 'POST';
            const body = (id && !password) ? { username, email } : { username, email, password };

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json' // ✅ FIX: Ensures JSON error responses
                    },
                    credentials: 'include',
                    body: JSON.stringify(body)
                });
                
                const contentType = res.headers.get("content-type");
                let responseData;
                if (contentType && contentType.includes("application/json")) {
                    responseData = await res.json();
                } else {
                    responseData = { error: 'Server returned non-JSON response. Check console.' };
                }

                if (res.ok) {
                    closeModal();
                    loadUsers();
                } else {
                    alert('Error: ' + (responseData.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Fetch error:', err);
                alert('Failed to save user. Check browser console for details.');
            }
        });

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                const res = await fetch(`/api/users/${id}`, {
                    method: 'DELETE',
                    credentials: 'include',
                    headers: { 'Accept': 'application/json' } // ✅ FIX
                });
                if (res.ok) {
                    loadUsers();
                } else {
                    const err = await res.json().catch(() => ({ error: 'Unknown error' }));
                    alert('Failed to delete user: ' + err.error);
                }
            } catch (err) {
                console.error('Delete error:', err);
                alert('Failed to delete user');
            }
        }

        async function logout() {
            await fetch('/api/logout', { 
                method: 'POST', 
                credentials: 'include',
                headers: { 'Accept': 'application/json' } // ✅ FIX
            });
            window.location.href = '/auth';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
        });
    </script>
</body>
</html>
