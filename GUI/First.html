<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', 'Google Sans', sans-serif;
    background-color: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background-color: #1e1e2e;
    display: flex;
    flex-direction: column;
    padding: 12px 8px;
    overflow-y: auto;
    border-right: 1px solid #2a2a3e;
    transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
  }

  .sidebar.collapsed {
    width: 0;
    min-width: 0;
    padding: 12px 0;
    overflow: hidden;
    opacity: 0;
    border-right: none;
  }

  .sidebar::-webkit-scrollbar {
    width: 4px;
  }

  .sidebar::-webkit-scrollbar-thumb {
    background: #3a3a4e;
    border-radius: 4px;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 8px 16px;
    white-space: nowrap;
    overflow: hidden;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gemini-logo {
    width: 28px;
    height: 28px;
    position: relative;
    flex-shrink: 0;
  }

  .gemini-logo svg {
    width: 28px;
    height: 28px;
  }

  .logo-text {
    font-size: 18px;
    font-weight: 500;
    color: #e8eaed;
  }

  .sidebar-toggle {
    background: none;
    border: none;
    color: #9aa0a6;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .sidebar-toggle:hover {
    background: #2a2a3e;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 14px;
    color: #c4c7c5;
    transition: background 0.2s;
    text-decoration: none;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
  }

  .nav-item:hover {
    background: #2a2a3e;
  }

  .nav-item.active {
    background: #2a2a3e;
    color: #e8eaed;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 12px;
    color: #7a7f85;
    padding: 16px 12px 8px;
    font-weight: 500;
    white-space: nowrap;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    overflow: hidden;
  }

  .user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #e07a5f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: white;
    flex-shrink: 0;
  }

  .user-name {
    font-size: 14px;
    color: #e8eaed;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .settings-btn {
    background: none;
    border: none;
    color: #9aa0a6;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .settings-btn:hover {
    background: #2a2a3e;
  }

  /* Main Content */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .toggle-sidebar-btn {
    background: none;
    border: none;
    color: #9aa0a6;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .toggle-sidebar-btn:hover {
    background: #2a2a3e;
  }

  .edit-btn {
    background: none;
    border: none;
    color: #9aa0a6;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .edit-btn:hover {
    background: #2a2a3e;
  }

  .main-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .glow-bg {
    position: absolute;
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(66, 133, 244, 0.15) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .greeting {
    font-size: 44px;
    font-weight: 400;
    color: #e8eaed;
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
    letter-spacing: -0.5px;
  }

  .input-container {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }

  .input-box {
    display: flex;
    align-items: center;
    background: #2a2a3e;
    border-radius: 28px;
    padding: 14px 20px;
    gap: 12px;
    border: 1px solid #3a3a4e;
    transition: border-color 0.2s;
  }

  .input-box:focus-within {
    border-color: #5a5a6e;
  }

  .plus-btn {
    background: none;
    border: none;
    color: #9aa0a6;
    cursor: pointer;
    font-size: 22px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .input-field {
    flex: 1;
    background: none;
    border: none;
    color: #e8eaed;
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }

  .input-field::placeholder {
    color: #7a7f85;
  }

  .model-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: #c4c7c5;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 16px;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .model-selector:hover {
    background: #3a3a4e;
  }

  .model-selector svg {
    width: 16px;
    height: 16px;
  }

  .mic-btn {
    background: none;
    border: none;
    color: #9aa0a6;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.2s;
  }

  .mic-btn:hover {
    background: #3a3a4e;
  }

  .mic-btn svg {
    width: 20px;
    height: 20px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar {
      position: absolute;
      z-index: 10;
      height: 100%;
    }
    .sidebar.collapsed {
      display: none;
    }
    .greeting {
      font-size: 28px;
      padding: 0 20px;
    }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-container">
      <div class="gemini-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#grad1)"/>
          <defs>
            <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="22">
              <stop offset="0%" stop-color="#4285F4"/>
              <stop offset="25%" stop-color="#9B72F0"/>
              <stop offset="50%" stop-color="#D96570"/>
              <stop offset="75%" stop-color="#F4A261"/>
              <stop offset="100%" stop-color="#F4B942"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-text" id="logoText"></span>
    </div>
    <button class="sidebar-toggle" id="collapseBtn" title="Collapse sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
    </button>
  </div>

  <a class="nav-item active" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
    New chat
  </a>

  <a class="nav-item" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Search chats
  </a>

  <a class="nav-item" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    Images
  </a>

  <a class="nav-item" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="23 7 16 12 23 17 23 7"/>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
    </svg>
    Videos
  </a>

  <div class="section-label">Folders</div>
  <a class="nav-item" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    New notebook
  </a>

  <div class="sidebar-footer">
    <div class="user-avatar">A</div>
    <span class="user-name">User</span>
    <button class="settings-btn" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </div>
</aside>

<!-- Main Content -->
<main class="main-content">
  <div class="main-header">
    <div class="header-left">
      <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
    </div>
    <div class="header-right">
      <button class="edit-btn" title="Edit">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-body">
    <div class="glow-bg"></div>
    <h1 class="greeting">Hi, user. What's on your mind?</h1>

    <div class="input-container">
      <div class="input-box">
        <button class="plus-btn" title="Add">+</button>
        <input type="text" class="input-field" placeholder="Ask Gemini" id="chatInput">
        <button class="model-selector" id="modelBtn">
          Flash-Lite
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <button class="mic-btn" title="Voice input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</main>

<script>
  const sidebar = document.getElementById('sidebar');
  const collapseBtn = document.getElementById('collapseBtn');
  const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
  const chatInput = document.getElementById('chatInput');
  const modelBtn = document.getElementById('modelBtn');

  function toggleSidebar() {
    sidebar.classList.toggle('collapsed');
  }

  collapseBtn.addEventListener('click', toggleSidebar);
  toggleSidebarBtn.addEventListener('click', toggleSidebar);

  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && this.value.trim()) {
      alert('You asked: ' + this.value.trim());
      this.value = '';
    }
  });

  modelBtn.addEventListener('click', function() {
    const models = ['Flash-Lite', 'Flash', 'Pro', 'Ultra'];
    const textNode = this.childNodes[0];
    const current = textNode.textContent.trim();
    const idx = models.indexOf(current);
    const next = models[(idx + 1) % models.length];
    textNode.textContent = next + ' ';
  });
</script>

</body>

</html>
